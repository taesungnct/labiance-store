<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Shopee OAuth Callback — Laviance</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f6f4ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif;
    color: #211d15;
  }
  .card {
    max-width: 560px;
    width: 92%;
    background: #fff;
    border: 1px solid #e6e0d1;
    border-radius: 12px;
    padding: 28px 30px;
    box-shadow: 0 8px 24px -12px rgba(33,29,21,0.18);
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #766e5b; margin: 0 0 20px; }
  .field { margin-bottom: 14px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #a89f8a; margin-bottom: 4px; }
  .value-row { display: flex; gap: 8px; align-items: center; }
  .value {
    flex: 1;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 13px;
    background: #fbfaf6;
    border: 1px solid #e6e0d1;
    border-radius: 6px;
    padding: 8px 10px;
    word-break: break-all;
  }
  button.copy {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #a97a2b;
    background: #f1e4c8;
    color: #a97a2b;
    cursor: pointer;
  }
  button.copy:active { transform: scale(0.97); }
  .empty { font-size: 13px; color: #a89f8a; padding: 20px 0; }
</style>
</head>
<body>
  <div class="card">
    <h1>Shopee 인증 콜백</h1>
    <p class="sub">아래 값을 복사해서 서버의 토큰 교환 스크립트에 붙여넣으세요. 이 페이지는 값을 저장하지 않습니다.</p>
    <div id="fields"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const container = document.getElementById("fields");

    if ([...params.keys()].length === 0) {
      container.innerHTML = '<p class="empty">전달된 파라미터가 없습니다.</p>';
    } else {
      for (const [key, val] of params.entries()) {
        const field = document.createElement("div");
        field.className = "field";
        field.innerHTML = `
          <div class="label">${key}</div>
          <div class="value-row">
            <div class="value">${val}</div>
            <button class="copy" data-value="${val}">복사</button>
          </div>
        `;
        container.appendChild(field);
      }
      container.querySelectorAll("button.copy").forEach((btn) => {
        btn.addEventListener("click", () => {
          navigator.clipboard.writeText(btn.dataset.value);
          btn.textContent = "복사됨";
          setTimeout(() => (btn.textContent = "복사"), 1500);
        });
      });
    }
  </script>
</body>
</html>
